name: Build AWG kmod (AmneziaWG 3.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget ccache \
            libelf-dev python3-dev

      - name: Setup OpenWrt tree (ADCDS way)
        run: |
          set -e
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --depth 1 origin 25ee12629edcc38feffbd06255dd47840cd7af7e
          git checkout 25ee12629edcc38feffbd06255dd47840cd7af7e

          # Overlay device support from this repo
          cp -a ../files/. .

          # Pin feeds from feeds.lock
          if [ -f ../feeds.lock ]; then
            while read -r feed rev; do
              case "$feed" in ''|'#'*) continue ;; esac
              grep -q "^src-git $feed " feeds.conf.default || continue
              sed -i "s#^src-git $feed \([^;^ ]*\).*#src-git $feed \1^$rev#" feeds.conf.default
            done < ../feeds.lock
          fi

          # Add AmneziaWG feed (AWG 3.1)
          echo "src-git amneziawg https://github.com/this-username-has-been-taken/amneziawg-openwrt.git" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install kmod-amneziawg amneziawg-tools luci-proto-amneziawg || true

      - name: Configure for RD03v2 + AWG
        working-directory: openwrt
        run: |
          set -e
          # Minimal config for the device
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_mi-router-ax3000t-v2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # Packages we need
          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          # Keep image lean
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          EOF
          # Strip leading spaces from heredoc (YAML needs indent, shell does not)
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Build only AWG packages
        working-directory: openwrt
        run: |
          set -e
          # First build toolchain + kernel so vermagic matches
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/compile -j$(nproc)

          # Now the packages
          make package/kmod-amneziawg/compile -j$(nproc) V=s || make package/feeds/amneziawg/kmod-amneziawg/compile -j$(nproc) V=s
          make package/amneziawg-tools/compile -j$(nproc) || true
          make package/luci-proto-amneziawg/compile -j$(nproc) || true

          # Collect artifacts
          mkdir -p /tmp/awg-out
          find bin \( -name 'kmod-amneziawg*.apk' -o -name 'amneziawg-tools*.apk' -o -name 'luci-proto-amneziawg*.apk' \) 2>/dev/null | while read f; do
            cp -v "$f" /tmp/awg-out/
          done
          ls -la /tmp/awg-out/ || echo "No .apk found, trying .ipk"
          find bin \( -name 'kmod-amneziawg*.ipk' -o -name 'amneziawg-tools*.ipk' -o -name 'luci-proto-amneziawg*.ipk' \) 2>/dev/null | while read f; do
            cp -v "$f" /tmp/awg-out/
          done
          ls -la /tmp/awg-out/

      - name: Upload AWG packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-kmod-adcds-r35297
          path: /tmp/awg-out/*
          if-no-files-found: warn
          retention-days: 14
