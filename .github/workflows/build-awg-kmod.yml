name: Build AWG kmod (AmneziaWG 3.1)

on:
  workflow_dispatch:

env:
  OPENWRT_COMMIT: 25ee12629edcc38feffbd06255dd47840cd7af7e
  AWG_COMMIT: 01c4ad754d8fd04256bad962f7e6375ca98ec776
  EXPECTED_VERMAGIC: 22588d2e9f0a25da3a9864a6592f9e13
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget ccache \
            libelf-dev python3-dev zstd
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.OPENWRT_COMMIT }}-v5
          restore-keys: |
            ccache-${{ env.OPENWRT_COMMIT }}-
            ccache-

      - name: Restore OpenWrt dl
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ env.OPENWRT_COMMIT }}-v5
          restore-keys: |
            owrt-dl-${{ env.OPENWRT_COMMIT }}-
            owrt-dl-

      - name: Restore toolchain tarball
        id: cache-tc
        uses: actions/cache/restore@v4
        with:
          path: /tmp/owrt-tc.tar.zst
          key: owrt-tc-tar-${{ env.OPENWRT_COMMIT }}-v5
          restore-keys: |
            owrt-tc-tar-${{ env.OPENWRT_COMMIT }}-

      - name: Setup OpenWrt tree (ADCDS way + KMODS=1)
        run: |
          set -e
          if [ ! -d openwrt/.git ]; then
            mkdir -p /tmp/owrt-preserve
            for d in dl staging_dir build_dir; do
              if [ -d "openwrt/$d" ]; then
                mv "openwrt/$d" "/tmp/owrt-preserve/$d"
                echo "Preserved cached openwrt/$d"
              fi
            done
            rm -rf openwrt
            git clone https://github.com/openwrt/openwrt.git openwrt
            for d in dl staging_dir build_dir; do
              if [ -d "/tmp/owrt-preserve/$d" ]; then
                rm -rf "openwrt/$d"
                mv "/tmp/owrt-preserve/$d" "openwrt/$d"
                echo "Restored cached openwrt/$d"
              fi
            done
          fi

          # Unpack toolchain tarball if restored
          if [ -f /tmp/owrt-tc.tar.zst ]; then
            echo "Unpacking toolchain tarball..."
            tar -I 'zstd -T0' -xf /tmp/owrt-tc.tar.zst -C openwrt
            echo "Toolchain tarball unpacked"
          fi

          cd openwrt
          git fetch --depth 1 origin "$OPENWRT_COMMIT" || git fetch origin "$OPENWRT_COMMIT"
          git checkout -f "$OPENWRT_COMMIT"

          cp -a ../files/. .

          if [ ! -f ../feeds.lock ]; then
            echo "ERROR: feeds.lock missing" >&2
            exit 1
          fi
          while read -r feed rev; do
            case "$feed" in ''|'#'*) continue ;; esac
            grep -q "^src-git $feed " feeds.conf.default || continue
            sed -i "s#^src-git $feed \([^;^ ]*\).*#src-git $feed \1^$rev#" feeds.conf.default
            grep -q "^src-git $feed [^ ]*\^$rev\$" feeds.conf.default || {
              echo "ERROR: could not pin feed $feed to $rev" >&2
              exit 1
            }
          done < ../feeds.lock

          sed -i '/amneziawg/d' feeds.conf.default
          echo "src-git amneziawg https://github.com/samara1531/awg2.git^${AWG_COMMIT}" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install kmod-amneziawg amneziawg-tools luci-proto-amneziawg

          # Keep EXTRA_CFLAGS fix for missing-prototypes (still applies to new Makefile)
          MK=feeds/amneziawg/kmod-amneziawg/Makefile
          if [ -f "$MK" ] && ! grep -q 'Wno-error=missing-prototypes' "$MK"; then
            sed -i 's|EXTRA_CFLAGS="\$(BUILDFLAGS)"|EXTRA_CFLAGS="\$(BUILDFLAGS) -Wno-error=missing-prototypes -Wno-missing-prototypes"|' "$MK"
            echo "Patched AWG Makefile: -Wno-error=missing-prototypes"
          fi

      - name: Configure (exact ADCDS release set — no AWG yet)
        working-directory: openwrt
        run: |
          set -e
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_mi-router-ax3000t-v2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_ALL_KMODS=y
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

          grep -q '^CONFIG_ALL_KMODS=y$' .config || {
            echo "ERROR: CONFIG_ALL_KMODS was lost after defconfig" >&2
            exit 1
          }

          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done

          make download -j"$(nproc)" || true

      - name: Build toolchain + kernel + AWG packages
        id: compile
        working-directory: openwrt
        run: |
          set -e
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"

          make tools/install -j"$(nproc)" IGNORE_ERRORS="n m"
          make toolchain/install -j"$(nproc)" IGNORE_ERRORS="n m"
          make target/linux/compile -j"$(nproc)" IGNORE_ERRORS="n m" BUILD_LOG=1

          # Snapshot vermagic from the frozen kernel tree
          if [ -f .vermagic ]; then
            echo "Kernel .vermagic after linux/compile: $(cat .vermagic)"
            cp -a .vermagic /tmp/vermagic.after-kernel
          fi

          # Enable AWG packages ONLY now (kernel already built → vermagic stays).
          # Do NOT run defconfig/oldconfig here — that can rewrite Kernel-Config.
          for p in kmod-amneziawg amneziawg-tools luci-proto-amneziawg ucode luci-lib-uqr resolveip; do
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
          done
          {
            echo "CONFIG_PACKAGE_kmod-amneziawg=m"
            echo "CONFIG_PACKAGE_amneziawg-tools=y"
            echo "CONFIG_PACKAGE_luci-proto-amneziawg=y"
            echo "CONFIG_PACKAGE_ucode=y"
            echo "CONFIG_PACKAGE_luci-lib-uqr=y"
            echo "CONFIG_PACKAGE_resolveip=y"
          } >> .config

          # Compile only (no install target for package/*/)
          make package/feeds/amneziawg/kmod-amneziawg/clean -j"$(nproc)" || true
          make package/feeds/amneziawg/kmod-amneziawg/compile -j"$(nproc)" V=s
          make package/feeds/amneziawg/amneziawg-tools/compile -j"$(nproc)" V=s
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j"$(nproc)" V=s

          # crypto-модули лежат в package/kernel/crypto, таргетов вида package/<имя>/compile нет
          make "package/kernel/crypto/compile" -j"$(nproc)" 2>/dev/null || true

          for p in kmod-crypto-kpp kmod-crypto-lib-chacha20 kmod-crypto-lib-poly1305 \
                   kmod-crypto-lib-chacha20poly1305 kmod-crypto-lib-curve25519 \
                   kmod-udptunnel4 kmod-udptunnel6; do
            make "package/kernel/linux/compile" -j"$(nproc)" 2>/dev/null || true
            make "package/$p/compile" -j"$(nproc)" 2>/dev/null || true
          done

          # Prove AWG actually built
          echo "=== looking for amneziawg.ko ==="
          find build_dir -name 'amneziawg.ko' 2>/dev/null | head -5
          find bin -name 'kmod-amneziawg*' 2>/dev/null | head -10

          if [ -f /tmp/vermagic.after-kernel ] && [ -f .vermagic ]; then
            echo "vermagic before AWG: $(cat /tmp/vermagic.after-kernel)"
            echo "vermagic after  AWG: $(cat .vermagic)"
            if ! cmp -s /tmp/vermagic.after-kernel .vermagic; then
              echo "WARNING: .vermagic changed after enabling AWG packages" >&2
            fi
          fi

          echo "=== ccache stats ==="
          ccache -s || true

      - name: Pack toolchain cache
        if: always() && steps.cache-tc.outputs.cache-hit != 'true'
        working-directory: openwrt
        run: |
          set -e
          rm -f /tmp/owrt-tc.tar.zst
          tar -I 'zstd -T0 -3' -cf /tmp/owrt-tc.tar.zst --ignore-failed-read \
            staging_dir build_dir/host $(ls -d build_dir/toolchain-* 2>/dev/null || true)
          SIZE=$(stat -c%s /tmp/owrt-tc.tar.zst)
          echo tarball=$SIZE
          if [ "$SIZE" -gt 9000000000 ]; then rm -f /tmp/owrt-tc.tar.zst; fi

      - name: Save ccache
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ env.OPENWRT_COMMIT }}-v5

      - name: Save OpenWrt dl
        if: always() && steps.cache-dl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ env.OPENWRT_COMMIT }}-v5

      - name: Save toolchain tarball
        if: always() && steps.cache-tc.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/owrt-tc.tar.zst
          key: owrt-tc-tar-${{ env.OPENWRT_COMMIT }}-v5

      - name: Collect artifacts and check vermagic
        working-directory: openwrt
        run: |
          set -e
          mkdir -p /tmp/awg-out

          find bin -type f \( \
            -name 'kmod-amneziawg*.apk' -o -name 'kmod-amneziawg*.ipk' -o \
            -name 'amneziawg-tools*.apk' -o -name 'amneziawg-tools*.ipk' -o \
            -name 'luci-proto-amneziawg*.apk' -o -name 'luci-proto-amneziawg*.ipk' -o \
            -name 'ucode*.apk' -o -name 'ucode*.ipk' -o \
            -name 'luci-lib-uqr*.apk' -o -name 'luci-lib-uqr*.ipk' -o \
            -name 'resolveip*.apk' -o -name 'resolveip*.ipk' -o \
            -name 'kmod-crypto-kpp*.apk' -o -name 'kmod-crypto-kpp*.ipk' -o \
            -name 'kmod-crypto-lib-chacha20*.apk' -o -name 'kmod-crypto-lib-chacha20*.ipk' -o \
            -name 'kmod-crypto-lib-chacha20poly1305*.apk' -o -name 'kmod-crypto-lib-chacha20poly1305*.ipk' -o \
            -name 'kmod-crypto-lib-poly1305*.apk' -o -name 'kmod-crypto-lib-poly1305*.ipk' -o \
            -name 'kmod-crypto-lib-curve25519*.apk' -o -name 'kmod-crypto-lib-curve25519*.ipk' -o \
            -name 'kmod-udptunnel4*.apk' -o -name 'kmod-udptunnel4*.ipk' -o \
            -name 'kmod-udptunnel6*.apk' -o -name 'kmod-udptunnel6*.ipk' \
          \) -print0 | while IFS= read -r -d '' f; do
            cp -v "$f" /tmp/awg-out/
          done

          echo "=== Artifacts ==="
          ls -la /tmp/awg-out/

          # Hard checks: required packages must be present
          for p in kmod-amneziawg amneziawg-tools kmod-crypto-kpp \
                   kmod-crypto-lib-chacha20 kmod-crypto-lib-poly1305 \
                   kmod-crypto-lib-chacha20poly1305 kmod-crypto-lib-curve25519 \
                   kmod-udptunnel4 kmod-udptunnel6; do
            ls /tmp/awg-out/${p}*.apk >/dev/null 2>&1 || {
              echo "ERROR: ${p} missing in artifacts" >&2
              ls -la /tmp/awg-out/ >&2
              exit 1
            }
          done

          # Version must be 3.1.x (not the abandoned 0.0.1 / 1.0 feed)
          ls /tmp/awg-out/kmod-amneziawg-6.12.94.3.1.*.apk >/dev/null 2>&1 || {
            echo "ERROR: kmod-amneziawg is not 3.1.x" >&2
            ls /tmp/awg-out/kmod-amneziawg* >&2
            exit 1
          }

          # Verify AWG 3.x and kernel via uncompressed .ko (apk is compressed ADB)
          echo "=== module strings check ==="
          ko=$(find build_dir -name 'amneziawg.ko' 2>/dev/null | head -1)
          if [ -z "$ko" ]; then
            echo "ERROR: amneziawg.ko not found in build_dir" >&2
            exit 1
          fi
          echo "ko: $ko"
          strings "$ko" | grep -E 'AmneziaWG|vermagic=' || true
          strings "$ko" | grep -q 'AmneziaWG 3\.' || {
            echo "ERROR: not AWG 3.x" >&2
            exit 1
          }
          strings "$ko" | grep -q 'vermagic=6.12.94' || {
            echo "ERROR: wrong kernel" >&2
            exit 1
          }

      - name: Upload AWG packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-kmod-adcds-allkmods
          path: /tmp/awg-out/*
          if-no-files-found: error
          retention-days: 14
