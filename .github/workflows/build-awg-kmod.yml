name: Build AWG kmod (AmneziaWG 3.1)

on:
  workflow_dispatch:

env:
  OPENWRT_COMMIT: 25ee12629edcc38feffbd06255dd47840cd7af7e
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget ccache \
            libelf-dev python3-dev
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      # ── caches: first run still ~1–2 h; later runs often 15–40 min ──
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('feeds.lock') }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('feeds.lock') }}-
            ccache-${{ env.OPENWRT_COMMIT }}-
            ccache-

      - name: Cache OpenWrt dl (sources)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: owrt-dl-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('feeds.lock') }}
          restore-keys: |
            owrt-dl-${{ env.OPENWRT_COMMIT }}-
            owrt-dl-

      - name: Cache OpenWrt staging_dir (toolchain)
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: owrt-tc-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('feeds.lock') }}-v2
          restore-keys: |
            owrt-tc-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('feeds.lock') }}-
            owrt-tc-${{ env.OPENWRT_COMMIT }}-

      - name: Setup OpenWrt tree (ADCDS way + KMODS=1)
        run: |
          set -e
          if [ ! -d openwrt/.git ]; then
            git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          fi
          cd openwrt
          git fetch --depth 1 origin "$OPENWRT_COMMIT" || true
          git checkout -f "$OPENWRT_COMMIT"

          # Overlay device support from this repo (same as build.sh)
          cp -a ../files/. .

          # Pin feeds from feeds.lock (same as build.sh)
          if [ ! -f ../feeds.lock ]; then
            echo "ERROR: feeds.lock missing" >&2
            exit 1
          fi
          while read -r feed rev; do
            case "$feed" in ''|'#'*) continue ;; esac
            grep -q "^src-git $feed " feeds.conf.default || continue
            sed -i "s#^src-git $feed \([^;^ ]*\).*#src-git $feed \1^$rev#" feeds.conf.default
            grep -q "^src-git $feed [^ ]*\^$rev\$" feeds.conf.default || {
              echo "ERROR: could not pin feed $feed to $rev" >&2
              exit 1
            }
          done < ../feeds.lock

          # Official AmneziaWG feed
          grep -q 'amneziawg-openwrt' feeds.conf.default || \
            echo "src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install kmod-amneziawg amneziawg-tools luci-proto-amneziawg

          # Fix amneziawg patch: missing prototype → -Werror=missing-prototypes
          PATCH=feeds/amneziawg/kmod-amneziawg/files/000-initial-amneziawg.patch
          if [ -f "$PATCH" ]; then
            sed -i 's/^\(+\)u32 wg_get_random_u32_inclusive/\1static u32 wg_get_random_u32_inclusive/' "$PATCH"
            grep -q 'static u32 wg_get_random_u32_inclusive' "$PATCH" || {
              echo "ERROR: failed to patch wg_get_random_u32_inclusive as static" >&2
              exit 1
            }
            echo "Patched $PATCH: wg_get_random_u32_inclusive → static"
          fi

      - name: Configure (match ADCDS release + ALL_KMODS + ccache)
        working-directory: openwrt
        run: |
          set -e
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_mi-router-ax3000t-v2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_ALL_KMODS=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_CCACHE=y
          CONFIG_DEVEL=y
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

          grep -q '^CONFIG_ALL_KMODS=y$' .config || {
            echo "ERROR: CONFIG_ALL_KMODS was lost after defconfig" >&2
            exit 1
          }

          # Pre-download sources (uses dl/ cache)
          make download -j"$(nproc)" || true

      - name: Build toolchain + kernel + AWG packages
        working-directory: openwrt
        run: |
          set -e
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${{ github.workspace }}/.ccache"

          # tools + toolchain: cached via staging_dir / build_dir
          make tools/install -j"$(nproc)"
          make toolchain/install -j"$(nproc)"
          make target/linux/compile -j"$(nproc)"

          # AWG packages only (not the full image)
          make package/feeds/amneziawg/kmod-amneziawg/compile -j"$(nproc)" V=s
          make package/feeds/amneziawg/amneziawg-tools/compile -j"$(nproc)" V=s
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j"$(nproc)" V=s

          # Explicit deps so they land in bin/
          for p in kmod-crypto-kpp kmod-crypto-lib-chacha20 kmod-crypto-lib-chacha20poly1305 \
                   kmod-crypto-lib-curve25519 kmod-udptunnel4 kmod-udptunnel6; do
            make "package/kernel/linux/compile" -j"$(nproc)" || true
            make "package/$p/compile" -j"$(nproc)" 2>/dev/null || \
              make "package/kernel/$p/compile" -j"$(nproc)" 2>/dev/null || true
          done

          echo "=== ccache stats ==="
          ccache -s || true

      - name: Collect artifacts and check vermagic
        working-directory: openwrt
        run: |
          set -e
          mkdir -p /tmp/awg-out

          find bin -type f \( \
            -name 'kmod-amneziawg*.apk' -o -name 'kmod-amneziawg*.ipk' -o \
            -name 'amneziawg-tools*.apk' -o -name 'amneziawg-tools*.ipk' -o \
            -name 'luci-proto-amneziawg*.apk' -o -name 'luci-proto-amneziawg*.ipk' -o \
            -name 'kmod-crypto-kpp*.apk' -o -name 'kmod-crypto-kpp*.ipk' -o \
            -name 'kmod-crypto-lib-chacha20*.apk' -o -name 'kmod-crypto-lib-chacha20*.ipk' -o \
            -name 'kmod-crypto-lib-chacha20poly1305*.apk' -o -name 'kmod-crypto-lib-chacha20poly1305*.ipk' -o \
            -name 'kmod-crypto-lib-curve25519*.apk' -o -name 'kmod-crypto-lib-curve25519*.ipk' -o \
            -name 'kmod-udptunnel4*.apk' -o -name 'kmod-udptunnel4*.ipk' -o \
            -name 'kmod-udptunnel6*.apk' -o -name 'kmod-udptunnel6*.ipk' \
          \) -print0 | while IFS= read -r -d '' f; do
            cp -v "$f" /tmp/awg-out/
          done

          echo "=== Artifacts ==="
          ls -la /tmp/awg-out/

          test -n "$(ls /tmp/awg-out/kmod-amneziawg* 2>/dev/null)" || {
            echo "ERROR: kmod-amneziawg not built" >&2
            exit 1
          }
          test -n "$(ls /tmp/awg-out/amneziawg-tools* 2>/dev/null)" || {
            echo "ERROR: amneziawg-tools not built" >&2
            exit 1
          }
          test -n "$(ls /tmp/awg-out/luci-proto-amneziawg* 2>/dev/null)" || {
            echo "ERROR: luci-proto-amneziawg not built" >&2
            exit 1
          }

          if command -v modinfo >/dev/null 2>&1; then
            ko=$(find build_dir -name 'amneziawg.ko' 2>/dev/null | head -1)
            if [ -n "$ko" ]; then
              echo "=== vermagic from amneziawg.ko ==="
              modinfo "$ko" | grep -E 'vermagic|version' || true
            fi
          fi
          if [ -f .vermagic ]; then
            echo "=== .vermagic ==="
            cat .vermagic
          fi

      - name: Upload AWG packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-kmod-adcds-allkmods
          path: /tmp/awg-out/*
          if-no-files-found: error
          retention-days: 14
